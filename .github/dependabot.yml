version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/src/Kelvin.Client'
    schedule:
      interval: 'weekly'
    groups:
      kelvin-client:
        patterns:
          - '*'

  - package-ecosystem: 'nuget'
    directories:
      - '/src/Kelvin.Server'
      - '/src/Kelvin.Server.Tests'
    schedule:
      interval: 'weekly'
    groups:
      kelvin-server:
        group-by: dependency-name
        patterns:
          - '*'

  - package-ecosystem: 'nuget'
    directories:
      - '/src/Kelvin.Simulator'
      - '/src/Kelvin.Simulator.Tests'
    schedule:
      interval: 'weekly'
    groups:
      kelvin-simulator:
        group-by: dependency-name
        patterns:
          - '*'

  - package-ecosystem: 'pip'
    directory: '/src/Kelvin.Devices/Kiosk'
    schedule:
      interval: 'weekly'
    groups:
      kelvin-kiosk:
        patterns:
          - '*'
