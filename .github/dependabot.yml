version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/src/Kelvin.Client'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'nuget'
    directory: '/src/Kelvin.Server'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'nuget'
    directory: '/src/Kelvin.Server.Tests'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'nuget'
    directory: '/src/Kelvin.Simulator'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'nuget'
    directory: '/src/Kelvin.Simulator.Tests'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'pip'
    directory: '/src/Kelvin.Devices/Kiosk'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'
